<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- CYWEB teaser — screen film. 1920x1080, one GSAP timeline, seeked frame by frame.
     Frame numbers below are reference frame numbers (1-based, 30 fps); F(n) converts to seconds. -->
<style>
@font-face{font-family:Inter;font-weight:300;src:url(fonts/inter-latin-300-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/inter-latin-700-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
canvas#glow{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.beam{position:absolute;left:50%;top:0;transform-origin:50% 0;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(150,240,235,.95),rgba(0,170,175,.55) 45%,rgba(0,120,128,0) 72%);filter:blur(30px)}
.line{position:absolute;white-space:nowrap;letter-spacing:-0.01em;line-height:1}
.w{display:inline-block;will-change:filter,transform,opacity}
.grad{background:linear-gradient(90deg,#f2fcfb 0%,#c4efec 35%,#7fd8d2 75%,#46b4af 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* glass */
.glass{position:absolute;border-radius:36px;
  background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(160,240,235,.07));
  border:2.5px solid rgba(235,255,253,.9);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -10px 30px rgba(120,240,230,.10),inset 0 0 40px rgba(255,255,255,.06),0 0 24px rgba(180,255,250,.25)}
.icon{position:absolute;width:147px;height:147px;border-radius:34px}
.icon img{position:absolute;left:50%;top:50%;width:112px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 6px rgba(160,255,250,.6))}

/* cursor */
#cursor{position:absolute;left:0;top:0;width:80px;height:89px;opacity:0;transform-origin:4px 4px}

/* panel */
#panelWrap{position:absolute;inset:0;perspective:1920px;perspective-origin:960px 540px;opacity:0}
#panel{position:absolute;left:297px;top:126px;width:1326px;height:720px;transform-style:preserve-3d;border-radius:48px}
#panel .glass{inset:0;border-radius:48px;border-width:3px;background:linear-gradient(170deg,rgba(255,255,255,.20),rgba(220,250,248,.08) 40%,rgba(160,240,235,.12));box-shadow:inset 0 3px 0 rgba(255,255,255,.8),inset 0 0 60px rgba(200,255,250,.12),0 0 40px rgba(180,255,250,.35)}
.p-el{position:absolute;transform:translate(-50%,-50%)}
.chip{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd8de 55%,#7d8b94);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.chip svg{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%)}
.clab{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:17px;color:rgba(255,255,255,.9);white-space:nowrap}
.hd{font-size:17px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.85)}
.pill{height:50px;border-radius:25px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);font-size:17px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:12px;padding:0 22px;white-space:nowrap}
.pill i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa7ae);display:inline-block}

/* tunnel */
#tunnelWrap{position:absolute;inset:0;perspective:1100px;perspective-origin:964px 521px;opacity:0}
#tunnel{position:absolute;left:964px;top:521px;width:0;height:0;transform-style:preserve-3d}
.wall{position:absolute;transform-style:preserve-3d}
.phone{position:absolute;left:0;top:0;border-radius:120px;background:#0c0d10;padding:22px;box-shadow:0 0 0 4px #2a2c31,0 0 0 7px #0c0d10}
.phone .glass-in{position:absolute;inset:22px;border-radius:100px;overflow:hidden;background:#f4f6f6;filter:brightness(.76)}
.phone .glass-in img{width:100%;height:100%;object-fit:cover}

/* phone screens */
.scr{position:absolute;left:0;top:0;width:200%;height:200%;transform:scale(.5);transform-origin:0 0;font-family:Inter;color:#111;background:#fbfbfb}
.scr .sb{display:flex;justify-content:space-between;align-items:center;padding:30px 70px 0;font-weight:600;font-size:34px}
.scr .isl{width:250px;height:72px;border-radius:40px;background:#000}
.scr .nav{display:flex;justify-content:space-between;align-items:center;padding:40px 60px 20px;font-size:62px}
.scr .nav b{font-weight:700}
.scr .hero{margin:20px 50px;height:460px;border-radius:48px;padding:50px;display:flex;flex-direction:column;justify-content:space-between}
.scr .hero.cafe{background:#eceef0}
.scr .hero.clinic{background:#eceef0}
.scr .ht{font-size:70px;font-weight:700;line-height:1.05}
.scr .btn{align-self:flex-start;background:#1c1c1e;color:#fff;font-size:38px;font-weight:600;padding:22px 40px;border-radius:40px}
.scr .sec{font-size:40px;font-weight:700;padding:44px 60px 14px;color:#333}
.scr .li{display:flex;align-items:center;gap:30px;font-size:42px;padding:26px 60px;border-bottom:2px solid #e2e6e8}
.scr .li em{margin-left:auto;font-style:normal;color:#888;font-size:34px}
.scr .dot{width:40px;height:40px;border-radius:50%}
.scr .dot.o{background:#e8893c}.scr .dot.g{background:#3aa66b}.scr .dot.b{background:#005ff6}
.scr .map{margin:10px 50px;height:300px;border-radius:40px;background:repeating-linear-gradient(35deg,#dfe7e3 0 30px,#e9efec 30px 60px)}
.scr .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px 50px}
.scr .tile{height:220px;border-radius:36px;display:flex;align-items:flex-end;padding:26px;font-size:40px;font-weight:700;color:#fff}
.t1{background:#2f8f6b}.t2{background:#13a3a0}.t3{background:#1d6e74}.t4{background:#6cc24a}.t5{background:#0f5e63}.t6{background:#3b4752}
.scr .months{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 26px;padding:10px 46px}
.scr .mn{font-size:44px;font-weight:700;margin-bottom:12px}
.scr .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 2px;font-size:24px;font-weight:600;text-align:center}
.scr .grid i{font-style:normal;height:32px;line-height:32px}
.scr .grid i.sel{background:#111;color:#fff;border-radius:50%}
.scr .nav.cal b{font-size:76px}

/* whip phone */
#whipWrap{position:absolute;inset:0;perspective:1400px;perspective-origin:960px 540px}
#whip{position:absolute;left:0;top:0;opacity:0;transform-style:preserve-3d}

/* bar */
#bar{position:absolute;left:-900px;top:342px;height:404px;border-radius:202px;opacity:0;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(20,28,30,.55) 40%,rgba(10,50,52,.55) 85%,rgba(60,200,195,.25));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset -6px 0 0 rgba(255,255,255,.55),inset 0 -3px 2px rgba(255,255,255,.25),inset -40px -30px 60px rgba(130,240,230,.18),0 0 30px rgba(180,255,250,.15)}
#bar::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 97%,rgba(255,255,255,.45));mix-blend-mode:screen}
#pct{position:absolute;top:0;font-weight:400;font-size:151px;line-height:1;letter-spacing:-0.02em;color:#eef7f6;white-space:nowrap;font-variant-numeric:tabular-nums}
#contours{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}

/* logo end */
#logo{position:absolute;opacity:0}
#white{position:absolute;inset:0;background:#ede5d1;opacity:0}
#logoEnd{position:absolute;opacity:0}
</style></head>
<body>
<div id="stage">
  <canvas id="glow" width="1920" height="1080"></canvas>
  <div class="beam" id="beam"></div>

  <!-- 1–2: title + icon -->
  <div class="layer" id="s1">
    <div class="line" id="title" style="font-size:78px">
      <span class="w" id="tWith" style="font-weight:600">With</span><span class="w" id="slot" style="width:0"></span><span class="w grad" id="tName" style="font-weight:400">CYWEB Websites</span>
    </div>
    <div class="glass icon" id="icon"><img src="img/cy-mark-white.png"></div>
  </div>

  <!-- 3: panel -->
  <div id="panelWrap"><div id="panel">
    <div class="glass"></div>
    <div class="p-el" style="left:490px;top:131px">
      <div class="chip" style="width:96px;height:96px;background:radial-gradient(circle at 35% 30%,#7fb6ff,#005ff6 60%,#003a9e)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>
      <div class="clab" style="top:104px">Bookings</div></div>
    <div class="p-el" style="left:688px;top:189px">
      <div style="width:250px;height:250px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2b3d5a,#0b1220 70%);box-shadow:0 0 0 6px rgba(120,150,255,.55),0 0 40px 8px rgba(110,90,255,.55),inset 0 0 30px rgba(140,160,255,.35)">
        <svg viewBox="0 0 100 100" style="position:absolute;inset:0"><circle cx="50" cy="40" r="17" fill="#e9eef7"/><path d="M18 88c4-20 18-28 32-28s28 8 32 28" fill="#e9eef7"/></svg></div></div>
    <div class="p-el" style="left:850px;top:56px">
      <div style="width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3a4a63,#111a29);box-shadow:0 0 0 2px rgba(255,255,255,.6)"><svg viewBox="0 0 100 100" style="position:absolute;inset:0"><circle cx="50" cy="40" r="17" fill="#e9eef7"/><path d="M18 88c4-20 18-28 32-28s28 8 32 28" fill="#e9eef7"/></svg></div>
      <div class="clab" style="top:72px">Owner</div></div>
    <div class="glass icon p-el" id="pIcon" style="left:663px;top:420px;width:300px;height:218px;border-radius:44px;transform:translate(-50%,-50%)"><img src="img/cy-mark-white.png" style="width:220px"></div>
    <div class="p-el hd" style="left:214px;top:418px">SUGGESTIONS</div>
    <div class="p-el hd" style="left:1210px;top:418px">SHOW MORE</div>
    <div class="p-el" style="left:239px;top:480px"><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#334" stroke-width="2"><path d="M5 11h12a3 3 0 010 6h-1M5 11v5a4 4 0 004 4h4a4 4 0 004-4v-5M8 4v3M12 4v3"/></svg></div><div class="clab">Café</div></div>
    <div class="p-el" style="left:416px;top:480px"><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#334" stroke-width="2"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5L20 18M8.5 15.5L20 6"/></svg></div><div class="clab">Salon</div></div>
    <div class="p-el" style="left:946px;top:480px"><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#334" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></div><div class="clab">Reviews</div></div>
    <div class="p-el" style="left:1120px;top:480px"><div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="#334" stroke-width="2"><path d="M12 21s-7-6.5-7-12a7 7 0 0114 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div><div class="clab">Directions</div></div>
    <div class="p-el pill" style="left:330px;top:640px;width:420px"><i></i>Ask CYWEB…</div>
    <div class="p-el pill" style="left:960px;top:640px"><i></i>Bookings</div>
    <div class="p-el pill" style="left:1140px;top:640px"><i></i>Reviews</div>
    <div class="p-el" style="left:663px;top:672px;width:420px;height:6px;border-radius:3px;background:rgba(255,255,255,.8)"></div>
  </div></div>

  <!-- 4: invite -->
  <div class="layer" id="s3"><div class="line" id="invite" style="font-size:64px;font-weight:400"><span class="w" id="iA">Just</span> <span class="w" id="iB">Ask</span></div></div>

  <!-- 5: tunnel -->
  <div id="tunnelWrap"><div id="tunnel">
    <div class="wall" id="wL"><div class="phone" id="phL"><div class="glass-in" data-screen="cafe"></div></div></div>
    <div class="wall" id="wT"><div class="phone" id="phT"><div class="glass-in" data-screen="salon"></div></div></div>
    <div class="wall" id="wR"><div class="phone" id="phR"><div class="glass-in" data-screen="clinic"></div></div></div>
    <div class="wall" id="wB"><div class="phone" id="phB"><div class="glass-in" data-screen="calendar"></div></div></div>
  </div></div>
  <div class="layer" id="s4"><div class="line" id="payA" style="font-size:44px">Just Ask</div><div class="line" id="payB" style="font-size:60px"><span class="w">Watch</span> <span class="w">It</span> <span class="w">Grow</span></div></div>
  <div id="whipWrap"><div id="whip"><div class="phone" id="phW"><div class="glass-in" data-screen="calendar"></div></div></div></div>

  <!-- 6: bar -->
  <svg id="contours" viewBox="0 0 1920 1080"></svg>
  <div id="bar"><div id="pct">0%</div></div>

  <!-- 7: close -->
  <div class="layer" id="s6"><div class="line" id="close" style="font-size:64px;font-weight:500"><span class="w" id="cA">Your</span> <span class="w" id="cB">Business</span> <span class="w" id="cC">Online</span></div></div>
  <img id="logo" src="img/cy-mark-light.png">
  <div id="white"></div>
  <img id="logoEnd" src="img/cy-mark.png">

  <svg id="cursor" viewBox="0 0 72 80"><path d="M6 5 L64 40 L30 46 L14 74 Z" fill="rgba(255,255,255,.10)" stroke="rgba(255,255,255,.95)" stroke-width="3.5" stroke-linejoin="round"/></svg>
</div>
<script src="gsap.min.js"></script>
<script src="screens.js"></script>
<script src="glow.js"></script>
<script src="film.js"></script>
</body></html>
