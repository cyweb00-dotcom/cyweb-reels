<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Two labels above the monitor. Boxes/sizes from SHOT.md (reference x1.5). Accent = CYWEB blue. -->
<style>
@font-face{font-family:BC;font-weight:700;src:url(barlow-condensed-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
.box{position:absolute;left:50%;transform:translateX(-50%);background:#010101;border-radius:10.5px;display:flex;align-items:center;white-space:nowrap;
 font-family:BC;font-weight:700;color:#fafafb;text-transform:uppercase;letter-spacing:0}
.b1{top:262.5px;height:99px;font-size:62px;padding:0 25px 0 21px;gap:18px}
.b2{top:376.5px;height:78px;font-size:49px;padding:0 22px 0 18px;gap:16px}
.acc{color:#2f7dff}
svg{flex:none}
</style></head><body>
<div class="box b1" id="b1"><svg width="64" height="64" viewBox="-32 -32 64 64"><g id="spark1"></g></svg><span><span class="acc">CYWEB</span> BUILT THIS</span></div>
<div class="box b2" id="b2"><svg width="51" height="51" viewBox="-32 -32 64 64"><g id="spark2"></g></svg><span>COMMENT <span class="acc">"WEBSITE"</span> TO GET YOURS</span></div>
<script>
// 12-ray spark, rebuilt as a vector
for (const id of ['spark1','spark2']) { let p=''; for (let i=0;i<12;i++){ const a=i*Math.PI/6+(i%2?0.12:0), r=i%2?27:31, w=0.11;
  p+=`M${(Math.cos(a-w)*6).toFixed(2)} ${(Math.sin(a-w)*6).toFixed(2)} L${(Math.cos(a)*r).toFixed(2)} ${(Math.sin(a)*r).toFixed(2)} L${(Math.cos(a+w)*6).toFixed(2)} ${(Math.sin(a+w)*6).toFixed(2)} Z `; }
  document.getElementById(id).innerHTML=`<circle r="8" fill="#2f7dff"/><path d="${p}" fill="#2f7dff" stroke="#2f7dff" stroke-width="2.4" stroke-linejoin="round"/>`; }
</script></body></html>
