<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- STAND-IN desk plate (built in code) until the real desk shot is in assets/desk.*.
     Monitor screen corners are the reference corners scaled to 1080x1920 (SHOT.md). -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0806}
#wall{position:absolute;inset:0;
 background:
  radial-gradient(ellipse 900px 1100px at 540px 780px,rgba(255,200,140,.10),rgba(0,0,0,0) 70%),
  repeating-linear-gradient(90deg,#3a2c1b 0 30px,#4a3822 30px 33px,#3b2d1c 33px 36px,#0a0806 36px 50px);}
#wall::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 30%,rgba(0,0,0,.2) 70%,rgba(0,0,0,.7));}
#grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay}
#desk{position:absolute;left:0;right:0;top:1520px;bottom:0;background:linear-gradient(180deg,#1c120b,#120b06 40%,#070403);box-shadow:0 -2px 0 rgba(255,190,130,.10)}
#desk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(178deg,rgba(255,255,255,.015) 0 3px,rgba(0,0,0,.02) 3px 9px)}
svg{position:absolute;inset:0}
</style></head><body>
<div id="wall"></div><canvas id="grain" width="1080" height="1920"></canvas><div id="desk"></div>
<svg viewBox="0 0 1080 1920">
 <defs>
  <linearGradient id="bz" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121316"/><stop offset=".5" stop-color="#0b0c0e"/><stop offset="1" stop-color="#08090a"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1b1e"/><stop offset=".7" stop-color="#0c0d0f"/><stop offset="1" stop-color="#d9e4ea"/></linearGradient>
 </defs>
 <!-- stand: neck + foot -->
 <path d="M520 1230 L585 1225 L600 1530 L505 1534 Z" fill="#0d0e10"/>
 <ellipse cx="552" cy="1540" rx="210" ry="26" fill="#0a0b0c"/>
 <!-- bezel: screen quad grown outward; chin at the bottom -->
 <path d="M36 540 L1072 634 L1061 1206 L1060 1222 L32 1290 Z" fill="url(#bz)" stroke="#2a2c30" stroke-width="2"/>
 <path d="M32 1262 L1060 1200 L1060 1222 L32 1290 Z" fill="#101114"/>
 <!-- screen hole (keyed magenta: any visible magenta = lock failure) -->
 <path id="scr" d="M53.7 556.4 L1055.4 649.8 L1044.5 1188.6 L49.5 1244.0 Z" fill="#ff00ff"/>
 <!-- monitor light bar -->
 <path d="M210 505 L990 568 L988 600 L208 540 Z" fill="url(#bar)"/>
 <path d="M560 540 L640 546 L640 575 L560 570 Z" fill="#0b0c0e"/>
</svg>
<script>
const c=document.getElementById('grain').getContext('2d'),d=c.createImageData(1080,1920);
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<d.data.length;i+=4){const v=110+r()*36|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
c.putImageData(d,0,0);
</script></body></html>
