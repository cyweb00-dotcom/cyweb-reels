<!DOCTYPE html><html><head><meta charset="utf-8">
<!-- Burned-in captions for muted viewing. One caption at a time, rendered as transparent PNGs. -->
<style>
@font-face{font-family:IN;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:300px;background:transparent;overflow:hidden}
.cap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:IN;font-weight:800;font-size:72px;letter-spacing:-0.02em;color:#fff;
  padding:22px 40px 26px;border-radius:26px;background:rgba(8,8,10,.78);
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
.k{color:#3aaeff}
</style></head><body><div class="cap" id="c"></div></body></html>
